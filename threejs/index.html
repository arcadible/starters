<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport">
    <meta content="black" name="theme-color">
    <title>Untitled Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font: 600 18px/1.4 system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .hud {
        position: fixed;
        left: 0;
        right: 0;
        margin: 0;
        padding: 24px;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      #greeting {
        top: env(safe-area-inset-top);
      }

      #count {
        bottom: env(safe-area-inset-bottom);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <p class="hud" id="greeting"></p>
    <p class="hud" id="count"></p>
    <script src="./main.js" type="module"></script>
  </body>
</html>
